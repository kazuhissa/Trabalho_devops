name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Define release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Create ZIP package
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          PACKAGE="Trabalho_devops-${TAG}.zip"
          git archive \
            --format=zip \
            --prefix="Trabalho_devops-${TAG}/" \
            "$TAG" \
            -o "$PACKAGE"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload ZIP to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$TAG" "$PACKAGE" --clobber
